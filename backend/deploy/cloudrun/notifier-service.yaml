apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: notifier-service
  annotations:
    run.googleapis.com/ingress: internal-and-cloud-load-balancing
spec:
  template:
    spec:
      containers:
        - image: gcr.io/PROJECT_ID/notifier-service:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 256Mi
              cpu: "1"
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: latest
            - name: JWT_ALGORITHM
              value: HS256
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-secret
                  key: latest
